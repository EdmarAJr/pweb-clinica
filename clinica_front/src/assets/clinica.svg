<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="1200" viewBox="0 0 1000 1000"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E6DA4"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>
  </defs>

  <!-- Círculo Externo -->
  <circle cx="500" cy="400" r="300" fill="none" stroke="url(#circleGradient)" stroke-width="40"/>

  <!-- Fundo Interno -->
  <circle cx="500" cy="400" r="260" fill="#E8F4F8"/>

  <!-- Ondas -->
  <path d="M250 500 Q400 550 500 520 T750 540"
        fill="none" stroke="#4CAF50" stroke-width="15"/>

  <path d="M250 530 Q400 580 500 550 T750 570"
        fill="none" stroke="#2E6DA4" stroke-width="15"/>

  <!-- Linha de Batimento -->
  <polyline points="200,420 260,420 300,360 340,480 380,400 420,440 460,420"
            fill="none" stroke="#4CAF50" stroke-width="12"/>

  <!-- Farol Base -->
  <rect x="460" y="350" width="80" height="180" fill="#2E6DA4"/>

  <!-- Listras do Farol -->
  <rect x="460" y="380" width="80" height="30" fill="#F4B942"/>
  <rect x="460" y="440" width="80" height="30" fill="#F4B942"/>

  <!-- Topo do Farol -->
  <rect x="450" y="320" width="100" height="40" fill="#2E6DA4"/>
  <rect x="470" y="300" width="60" height="30" fill="#2E6DA4"/>

  <!-- Luz do Farol -->
  <line x1="520" y1="315" x2="650" y2="280"
        stroke="#B0E0E6" stroke-width="10"/>
  <line x1="520" y1="315" x2="650" y2="340"
        stroke="#B0E0E6" stroke-width="10"/>

  <!-- Texto Principal -->
  <text x="500" y="800" text-anchor="middle"
        font-family="Montserrat, Arial, sans-serif"
        font-size="70" fill="#2E6DA4" letter-spacing="5">
        CLÍNICA SALVADOR
  </text>

  <!-- Subtítulo -->
  <text x="500" y="870" text-anchor="middle"
        font-family="Montserrat, Arial, sans-serif"
        font-size="40" fill="#4CAF50" letter-spacing="4">
        MEDICINA &amp; SAÚDE
  </text>

</svg>
